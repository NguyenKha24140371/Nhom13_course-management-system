<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Learning · Danh sách học viên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body data-active="students" data-roles="TEACHER,ADMIN">
<div class="app" id="app">
  <main>
    <div class="content">
      <section class="page-head fade-up">
        <div>
          <span class="eyebrow">Giảng viên</span>
          <h1>Danh sách học viên</h1>
          <p>Học viên đã đăng ký các khóa học do bạn giảng dạy.</p>
        </div>
      </section>

      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Học viên</th><th>Khóa học</th><th>Tiến độ</th><th>Ngày đăng ký</th></tr></thead>
          <tbody id="studentBody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script>
const SEED_STUDENTS = [
  { name:'Alice K.', course:'Nền tảng Thiết kế UX/UI', progress:72, enrolled:'02/06/2026' },
  { name:'Priya R.', course:'Nhập môn Lý thuyết Trò chơi', progress:34, enrolled:'11/06/2026' },
  { name:'Tom H.', course:'Nền tảng Phát triển Doanh nghiệp', progress:100, enrolled:'20/05/2026' },
  { name:'Marco D.', course:'Nền tảng Thiết kế UX/UI', progress:12, enrolled:'19/07/2026' },
];
document.getElementById('studentBody').innerHTML = SEED_STUDENTS.map(s => `
  <tr>
    <td style="color:#fff;font-weight:600;">${s.name}</td>
    <td>${s.course}</td>
    <td style="min-width:140px;">
      <div class="progress-track" style="height:6px;border-radius:999px;background:var(--bg-chip);overflow:hidden;">
        <div style="height:100%;width:${s.progress}%;background:linear-gradient(90deg, var(--action-500), var(--brand-300));"></div>
      </div>
    </td>
    <td>${s.enrolled}</td>
  </tr>`).join('');
</script>
</body>
</html>
