<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Learning · Tạo khóa học</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body data-active="create" data-roles="TEACHER,ADMIN">
<div class="app" id="app">
  <main>
    <div class="content" style="max-width:760px;">
      <section class="page-head fade-up">
        <div>
          <span class="eyebrow">Giáo trình</span>
          <h1 id="formHeading">Tạo khóa học mới</h1>
          <p>Điền các thông tin cơ bản ngay bây giờ — bạn có thể thêm bài học sau.</p>
        </div>
      </section>

      <form class="panel" id="courseForm">
        <div class="field">
          <label for="title">Tên khóa học</label>
          <input type="text" id="title" placeholder="vd: Nền tảng Thiết kế UX/UI" required>
        </div>
        <div class="field">
          <label for="description">Mô tả khóa học</label>
          <textarea id="description" rows="4" placeholder="Học viên sẽ đạt được những gì khi hoàn thành khóa học?" required></textarea>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="price">Học phí (€)</label>
            <input type="number" id="price" min="0" step="1" value="23" required>
          </div>
          <div class="field">
            <label for="duration">Thời lượng (giờ)</label>
            <input type="number" id="duration" min="1" step="1" value="6" required>
          </div>
        </div>
        <div class="field">
          <label for="category">Danh mục</label>
          <select id="category">
            <option>Giáo dục</option>
            <option>Chứng chỉ</option>
            <option>Sức khỏe</option>
            <option>Nhà hàng & Khách sạn</option>
            <option>Ngoại ngữ</option>
            <option>Khác</option>
          </select>
        </div>
        <div style="display:flex; gap:10px; margin-top:8px;">
          <button type="submit" class="btn btn-primary" id="submitBtn">Xuất bản khóa học</button>
          <a href="#" id="cancelLink" class="btn btn-ghost">Hủy</a>
        </div>
      </form>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script>
const isAdmin = Auth.getRole() === 'ADMIN';
document.getElementById('cancelLink').href = isAdmin ? 'admin-courses.html' : 'teacher-dashboard.html';

const editId = new URLSearchParams(window.location.search).get('id');

(async function prefillIfEditing(){
  if (!editId) return;
  document.getElementById('formHeading').textContent = 'Chỉnh sửa khóa học';
  document.getElementById('submitBtn').textContent = 'Lưu thay đổi';
  try{
    const c = await CourseAPI.get(editId);
    document.getElementById('title').value = c.title || '';
    document.getElementById('description').value = c.description || '';
    document.getElementById('price').value = c.price ?? 23;
    document.getElementById('duration').value = c.duration ?? 6;
  }catch(e){ /* demo mode: leave fields blank */ }
})();

document.getElementById('courseForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const user = Auth.getUser();
  const payload = {
    title: document.getElementById('title').value.trim(),
    description: document.getElementById('description').value.trim(),
    price: Number(document.getElementById('price').value),
    duration: Number(document.getElementById('duration').value),
    instructorId: user ? user.id : null,
  };
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  try{
    if (editId) await CourseAPI.update(editId, payload);
    else await CourseAPI.create(payload);
    toast(editId ? 'Đã cập nhật khóa học.' : 'Đã xuất bản khóa học.');
  }catch(err){
    toast('Lỗi: ' + (err.message || 'Không thể lưu khóa học.'), 'error');
    btn.disabled = false;
    return;
  }
  setTimeout(() => window.location.href = isAdmin ? 'admin-courses.html' : 'teacher-dashboard.html', 700);
});
</script>
</body>
</html>
