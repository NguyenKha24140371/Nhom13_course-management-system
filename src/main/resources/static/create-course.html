<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Learning · Create Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body data-active="create" data-roles="TEACHER,ADMIN">
<div class="app" id="app">
  <main>
    <div class="content" style="max-width:760px;">
      <section class="page-head fade-up">
        <div>
          <span class="eyebrow">Giáo trình</span>
          <h1 id="formHeading">Create a new course</h1>
          <p>Fill in the basics now — you can add lessons right after.</p>
        </div>
      </section>

      <form class="panel" id="courseForm">
        <div class="field">
          <label for="title">Course title</label>
          <input type="text" id="title" placeholder="e.g. UX/UI Design Foundations" required>
        </div>
        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" rows="4" placeholder="What will students be able to do by the end?" required></textarea>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="price">Price (€)</label>
            <input type="number" id="price" min="0" step="1" value="23" required>
          </div>
          <div class="field">
            <label for="duration">Duration (hours)</label>
            <input type="number" id="duration" min="1" step="1" value="6" required>
          </div>
        </div>
        <div class="field">
          <label for="category">Category</label>
          <select id="category">
            <option>Education</option>
            <option>Certifications</option>
            <option>Health</option>
            <option>Hospitality</option>
            <option>Languages</option>
            <option>Other</option>
          </select>
        </div>
        <div style="display:flex; gap:10px; margin-top:8px;">
          <button type="submit" class="btn btn-primary" id="submitBtn">Publish course</button>
          <a href="#" id="cancelLink" class="btn btn-ghost">Cancel</a>
        </div>
      </form>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script>
const isAdmin = Auth.getRole() === 'ADMIN';
document.getElementById('cancelLink').href = isAdmin ? 'admin-courses.html' : 'teacher-dashboard.html';

const editId = new URLSearchParams(window.location.search).get('id');

(async function prefillIfEditing(){
  if (!editId) return;
  document.getElementById('formHeading').textContent = 'Edit course';
  document.getElementById('submitBtn').textContent = 'Save changes';
  try{
    const c = await CourseAPI.get(editId);
    document.getElementById('title').value = c.title || '';
    document.getElementById('description').value = c.description || '';
    document.getElementById('price').value = c.price ?? 23;
    document.getElementById('duration').value = c.duration ?? 6;
  }catch(e){ /* demo mode: leave fields blank */ }
})();

document.getElementById('courseForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = {
    title: document.getElementById('title').value.trim(),
    description: document.getElementById('description').value.trim(),
    price: Number(document.getElementById('price').value),
    duration: Number(document.getElementById('duration').value),
  };
  try{
    if (editId) await CourseAPI.update(editId, payload);
    else await CourseAPI.create(payload);
    toast(editId ? 'Course updated.' : 'Course published.');
  }catch(err){
    toast('Saved locally (demo mode — backend not reachable).');
  }
  setTimeout(() => window.location.href = isAdmin ? 'admin-courses.html' : 'teacher-dashboard.html', 700);
});
</script>
</body>
</html>
