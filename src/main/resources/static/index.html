<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Learning · Learn something new</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body data-active="">
<div class="app" id="app">
  <main>
    <div class="content">

      <section class="page-head fade-up">
        <div>
          <span class="eyebrow">E-Learning</span>
          <h1>Learn something new, on your schedule</h1>
          <p>Courses taught by real practitioners — track your progress and earn certificates as you go.</p>
        </div>
        <div style="display:flex; gap:10px;">
          <a href="courses.html" class="btn btn-ghost">Browse catalog</a>
          <a href="register.html" class="btn btn-primary">Get started</a>
        </div>
      </section>

      <section class="section" id="promotedSection" style="margin-top:0;">
        <div class="section__head">
          <h2>Promoted courses</h2>
          <a href="courses.html">View all →</a>
        </div>
        <div class="grid-cards" id="promotedGrid">
          <div class="course-card skeleton" style="height:230px"></div>
          <div class="course-card skeleton" style="height:230px"></div>
          <div class="course-card skeleton" style="height:230px"></div>
          <div class="course-card skeleton" style="height:230px"></div>
        </div>
      </section>

      <section class="section" id="categoriesSection">
        <div class="section__head">
          <h2>Categories</h2>
        </div>
        <div class="grid-cards" id="categoryGrid" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr));"></div>
      </section>

    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script>
// Signed-in users always land on their own dashboard, never the
// shared/guest page — index.html is purely the public entry point.
if (Auth.isLoggedIn()){
  window.location.replace(Auth.homeFor(Auth.getRole()));
}
</script>
<script src="js/shell.js"></script>
<script>
function courseCardHTML(c){
  const badge = c.badge === 'new' ? '<span class="badge badge-new">New</span>'
    : c.badge === 'hot' ? '<span class="badge badge-hot">Top rated</span>'
    : c.badge === 'promo' ? '<span class="badge badge-promo">Promoted</span>' : '';
  const img = c.img || `https://source.unsplash.com/random/400x300?study&sig=${c.id}`;
  return `
    <article class="course-card">
      <div class="course-card__media">
        <img src="${img}" alt="" loading="lazy">
        ${badge}
      </div>
      <div class="course-card__body">
        <h3 class="course-card__title">${c.title}</h3>
        ${starsHTML(c.rating || 4)}
        <div class="course-card__author">${c.instructorName || 'Instructor'}</div>
        <p class="course-card__desc">${c.description || ''}</p>
        <div class="course-card__foot">
          <span class="course-card__price">${money(c.price)}</span>
          <a class="btn btn-primary btn-sm" href="course-detail.html?id=${c.id}">View</a>
        </div>
      </div>
    </article>`;
}

function categoryCardHTML(cat){
  const items = cat.items.slice(0, 5).map(i => `<li><a href="courses.html?category=${encodeURIComponent(i)}">${i}</a></li>`).join('');
  const more = cat.more ? `<div class="category-card__more">Show more ▾</div>` : '';
  return `<div class="category-card"><h3>${cat.name}</h3><ul>${items}</ul>${more}</div>`;
}

(async function init(){
  const courses = await CourseAPI.list({ page:0, size:6 });
  document.getElementById('promotedGrid').innerHTML = courses.map(courseCardHTML).join('');
  document.getElementById('categoryGrid').innerHTML = DEMO_CATEGORIES.map(categoryCardHTML).join('');
})();
</script>
</body>
</html>
