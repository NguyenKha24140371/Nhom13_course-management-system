<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Learning · Materials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body data-active="materials" data-roles="TEACHER,ADMIN">
<div class="app" id="app">
  <main>
    <div class="content">
      <section class="page-head fade-up">
        <div>
          <span class="eyebrow" id="eyebrow">Teacher</span>
          <h1 id="heading">Course materials</h1>
          <p id="subheading">Upload slides, readings and assignments for your students.</p>
        </div>
      </section>

      <form class="panel" id="uploadForm" style="max-width:560px; margin-bottom:28px;">
        <div class="field">
          <label for="matTitle">Material title</label>
          <input type="text" id="matTitle" placeholder="e.g. Week 3 slides" required>
        </div>
        <div class="field">
          <label for="matCourse">Course</label>
          <select id="matCourse"></select>
        </div>
        <div class="field">
          <label for="matFile">File</label>
          <input type="file" id="matFile">
          <div class="field-hint">Demo UI only — file upload isn't wired to a backend endpoint yet.</div>
        </div>
        <button type="submit" class="btn btn-primary">Upload</button>
      </form>

      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Material</th><th>Course</th><th>Uploaded by</th><th>Date</th><th id="actionsHead"></th></tr></thead>
          <tbody id="materialBody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script>
const isAdmin = Auth.getRole() === 'ADMIN';
if (isAdmin){
  document.getElementById('eyebrow').textContent = 'Administration';
  document.getElementById('heading').textContent = 'Quản lý giáo trình';
  document.getElementById('subheading').textContent = 'All materials uploaded by instructors across the platform.';
  document.getElementById('uploadForm').style.display = 'none';
  document.getElementById('actionsHead').textContent = '';
}

const SEED_MATERIALS = [
  { title:'Week 1 — Intro slides', course:'UX/UI Design Foundations', by:'Akila M.', date:'12 Jul 2026' },
  { title:'Assignment brief.pdf', course:'Intro to Game Theory', by:'D. Marlowe', date:'18 Jul 2026' },
  { title:'Reading list.docx', course:'Business Development Fundamentals', by:'Akila M.', date:'20 Jul 2026' },
];

function rowHTML(m, i){
  const actions = isAdmin ? `<td style="text-align:right;"><button class="btn btn-outline-brand btn-sm remove-btn" data-i="${i}">Remove</button></td>` : '<td></td>';
  return `<tr><td style="color:#fff;font-weight:600;">${m.title}</td><td>${m.course}</td><td>${m.by}</td><td>${m.date}</td>${actions}</tr>`;
}
function renderMaterials(list){
  document.getElementById('materialBody').innerHTML = list.map(rowHTML).join('');
}
renderMaterials(SEED_MATERIALS);

document.getElementById('materialBody').addEventListener('click', (e) => {
  if (!e.target.classList.contains('remove-btn')) return;
  const i = Number(e.target.dataset.i);
  SEED_MATERIALS.splice(i, 1);
  renderMaterials(SEED_MATERIALS);
  toast('Material removed.');
});

(async function initCourseSelect(){
  const sel = document.getElementById('matCourse');
  if (!sel) return;
  const courses = await CourseAPI.list({ page:0, size:20 });
  sel.innerHTML = courses.map(c => `<option value="${c.id}">${c.title}</option>`).join('');
})();

const uploadForm = document.getElementById('uploadForm');
if (uploadForm){
  uploadForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const title = document.getElementById('matTitle').value.trim();
    if (!title) return;
    SEED_MATERIALS.unshift({ title, course: document.getElementById('matCourse').selectedOptions[0]?.textContent || '—', by: (Auth.getUser()||{}).fullName || 'You', date: new Date().toLocaleDateString() });
    renderMaterials(SEED_MATERIALS);
    uploadForm.reset();
    toast('Material uploaded (demo mode — no backend endpoint yet).');
  });
}
</script>
</body>
</html>
