<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Learning · Tạo tài khoản</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-visual">
    <div class="sidebar__brand" style="padding:0; color:#fff;"><span class="dot"></span> E-Learning</div>
    <div class="auth-visual__quote">
      <h2 style="font-size:1.6rem; color:#fff;">Tham gia nền tảng giúp bạn tiến bộ thực sự, không chỉ dừng lại ở thời gian xem video.</h2>
      <p style="color:rgba(255,255,255,0.75);">Theo dõi giờ học, nhận chứng chỉ và chia sẻ kiến thức của bạn.</p>
    </div>
    <p style="color:rgba(255,255,255,0.55); font-size:.78rem;">© 2026 E-Learning. Tất cả quyền được bảo lưu.</p>
  </div>

  <div class="auth-form-wrap">
    <div class="auth-card">
      <span class="eyebrow">Bắt đầu</span>
      <h1>Tạo tài khoản của bạn</h1>
      <p style="margin-bottom:26px;">Đã có tài khoản? <a href="login.html" style="color:var(--mint); font-weight:600;">Đăng nhập</a></p>

      <form id="registerForm" novalidate>
        <div class="field">
          <label for="fullName">Họ và tên</label>
          <input type="text" id="fullName" name="fullName" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="regUsername">Tên đăng nhập</label>
          <input type="text" id="regUsername" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="regPassword">Mật khẩu</label>
          <input type="password" id="regPassword" name="password" autocomplete="new-password" required minlength="6">
          <div class="field-hint">Ít nhất 6 ký tự.</div>
        </div>
        <div class="field">
          <label for="role">Tôi tham gia với tư cách</label>
          <select id="role" name="role">
            <option value="STUDENT">Học viên — Tham gia khóa học</option>
            <option value="INSTRUCTOR">Giảng viên — Giảng dạy khóa học</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Tạo tài khoản</button>
      </form>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const role = document.getElementById('role').value;
  const payload = {
    fullName: document.getElementById('fullName').value.trim(),
    email: document.getElementById('email').value.trim(),
    username: document.getElementById('regUsername').value.trim(),
    password: document.getElementById('regPassword').value,
    role: role,
  };
  try{
    await AuthAPI.register(payload);
    toast && toast('Đã tạo tài khoản — Vui lòng đăng nhập.');
  }catch(err){ /* demo mode: ignore network errors */ }
  window.location.href = `login.html?role=${encodeURIComponent(role === 'INSTRUCTOR' ? 'TEACHER' : role)}`;
});
</script>
</body>
</html>
