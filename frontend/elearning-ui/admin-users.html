<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Learning · Quản trị · Người dùng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body data-active="admin-users" data-roles="ADMIN">
<div class="app" id="app">
  <main>
    <div class="content">
      <section class="page-head fade-up">
        <div>
          <span class="eyebrow">Quản trị</span>
          <h1>Quản lý người dùng</h1>
          <p>Học viên, giảng viên và quản trị viên đã đăng ký trên hệ thống.</p>
        </div>
        <button class="btn btn-primary" id="inviteBtn">Mời người dùng</button>
      </section>

      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Họ và tên</th><th>Vai trò</th><th>Email</th><th>Ngày tham gia</th><th>Trạng thái</th><th></th></tr></thead>
          <tbody id="userBody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script>
let USERS = [
  { name:'System Administrator', role:'Quản trị viên', email:'admin123@gmail.com', joined:'Thg 1 2026', status:'Hoạt động' },
  { name:'Akila M.', role:'Giảng viên', email:'akila@elearning.io', joined:'Thg 1 2026', status:'Hoạt động' },
  { name:'Alice K.', role:'Học viên', email:'alice.k@mail.com', joined:'Thg 2 2026', status:'Hoạt động' },
  { name:'D. Marlowe', role:'Giảng viên', email:'d.marlowe@elearning.io', joined:'Thg 3 2026', status:'Hoạt động' },
  { name:'Priya R.', role:'Học viên', email:'priya.r@mail.com', joined:'Thg 4 2026', status:'Đã mời' },
  { name:'Tom H.', role:'Học viên', email:'tom.h@mail.com', joined:'Thg 6 2026', status:'Tạm khóa' },
];
const statusColor = { 'Hoạt động':'badge-new', 'Đã mời':'badge-hot', 'Tạm khóa':'badge-promo' };

function render(){
  document.getElementById('userBody').innerHTML = USERS.map((u,i) => `
    <tr>
      <td style="color:#fff; font-weight:600;">${u.name}</td>
      <td>${u.role}</td>
      <td>${u.email}</td>
      <td>${u.joined}</td>
      <td><span class="badge ${statusColor[u.status]}">${u.status}</span></td>
      <td style="text-align:right; white-space:nowrap;">
        <button class="btn btn-ghost btn-sm suspend-btn" data-i="${i}">${u.status === 'Tạm khóa' ? 'Kích hoạt lại' : 'Tạm khóa'}</button>
      </td>
    </tr>`).join('');
}
render();

document.getElementById('userBody').addEventListener('click', (e) => {
  if (!e.target.classList.contains('suspend-btn')) return;
  const i = Number(e.target.dataset.i);
  USERS[i].status = USERS[i].status === 'Tạm khóa' ? 'Hoạt động' : 'Tạm khóa';
  render();
  toast(`${USERS[i].name} hiện tại ${USERS[i].status}.`);
});

document.getElementById('inviteBtn').addEventListener('click', () => {
  toast('Chức năng mời người dùng ở chế độ demo — chưa có endpoint backend.');
});
</script>
</body>
</html>
