<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Learning · Lịch học</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body data-active="schedule" data-roles="STUDENT,TEACHER,ADMIN">
<div class="app" id="app">
  <main>
    <div class="content">
      <section class="page-head fade-up">
        <div>
          <span class="eyebrow" id="eyebrow">Học tập</span>
          <h1 id="heading">Lịch học</h1>
          <p id="subheading">Các buổi học trực tiếp và thời hạn bài tập sắp tới trong tuần.</p>
        </div>
      </section>

      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Thứ / Ngày</th><th>Thời gian</th><th>Khóa học</th><th>Loại hình</th></tr></thead>
          <tbody id="scheduleBody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script>
const role = Auth.getRole();
const COPY = {
  STUDENT: { eyebrow:'Học tập', heading:'Lịch học', sub:'Các buổi học trực tiếp và thời hạn bài tập sắp tới trong tuần.' },
  TEACHER: { eyebrow:'Giảng dạy', heading:'Lịch dạy', sub:'Các buổi giảng dạy sắp tới của bạn trong tuần.' },
  ADMIN:   { eyebrow:'Quản trị', heading:'Quản lý lịch học', sub:'Lịch giảng dạy trên toàn nền tảng.' },
};
const c = COPY[role] || COPY.STUDENT;
document.getElementById('eyebrow').textContent = c.eyebrow;
document.getElementById('heading').textContent = c.heading;
document.getElementById('subheading').textContent = c.sub;

const SEED_SCHEDULE = [
  { day:'Thứ Hai',   time:'18:00 – 19:30', course:'Nền tảng Thiết kế UX/UI', type:'Buổi học trực tiếp' },
  { day:'Thứ Ba',    time:'20:00 – 21:00', course:'Nhập môn Lý thuyết Trò chơi', type:'Giải đáp thắc mắc' },
  { day:'Thứ Năm',   time:'19:00 – 20:30', course:'Nền tảng Phát triển Doanh nghiệp', type:'Buổi học trực tiếp' },
  { day:'Thứ Bảy',   time:'10:00 – 11:00', course:'Nghệ thuật Cắm hoa & Thiết kế', type:'Hạn nộp bài tập' },
];
document.getElementById('scheduleBody').innerHTML = SEED_SCHEDULE.map(s => `
  <tr>
    <td style="color:#fff;font-weight:600;">${s.day}</td>
    <td>${s.time}</td>
    <td>${s.course}</td>
    <td><span class="badge badge-new">${s.type}</span></td>
  </tr>`).join('');
</script>
</body>
</html>
