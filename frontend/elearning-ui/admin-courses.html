<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Learning · Quản trị · Khóa học</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body data-active="admin-courses" data-roles="ADMIN">
<div class="app" id="app">
  <main>
    <div class="content">
      <section class="page-head fade-up">
        <div>
          <span class="eyebrow">Quản trị</span>
          <h1>Quản lý khóa học</h1>
          <p>Tất cả khóa học trên nền tảng. Quyền thêm, sửa, xóa đầy đủ.</p>
        </div>
        <a href="create-course.html" class="btn btn-primary">Thêm khóa học</a>
      </section>

      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Tên khóa học</th><th>Giảng viên</th><th>Học phí</th><th>Đánh giá</th><th></th></tr></thead>
          <tbody id="courseBody">
            <tr><td colspan="5"><div class="skeleton" style="height:40px;"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script>
function rowHTML(c){
  return `
    <tr data-id="${c.id}">
      <td><a class="row-course__title" href="course-detail.html?id=${c.id}">${c.title}</a></td>
      <td>${c.instructorName || '—'}</td>
      <td>${money(c.price)}</td>
      <td>${starsHTML(c.rating || 4)}</td>
      <td style="text-align:right; white-space:nowrap;">
        <button class="btn btn-ghost btn-sm edit-btn">Sửa</button>
        <button class="btn btn-outline-brand btn-sm delete-btn">Xóa</button>
      </td>
    </tr>`;
}

async function loadCourses(){
  const courses = await CourseAPI.list({ page:0, size:50 });
  document.getElementById('courseBody').innerHTML = courses.map(rowHTML).join('');
}

document.getElementById('courseBody').addEventListener('click', async (e) => {
  const row = e.target.closest('tr');
  if (!row) return;
  const id = row.dataset.id;

  if (e.target.classList.contains('delete-btn')){
    if (!confirm('Bạn có chắc chắn muốn xóa khóa học này?')) return;
    await CourseAPI.remove(id);
    row.remove();
    toast('Đã xóa khóa học.');
  }
  if (e.target.classList.contains('edit-btn')){
    window.location.href = `create-course.html?id=${id}`;
  }
});

loadCourses();
</script>
</body>
</html>
