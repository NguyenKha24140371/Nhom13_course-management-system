<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Learning · 403 Truy cập bị từ chối</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/components.css">
<style>
  .error-shell{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; }
  .error-code{ font-family:var(--font-display); font-size:clamp(3.5rem,10vw,6rem); font-weight:800; color:var(--action-500); line-height:1; }
</style>
</head>
<body>
<div class="error-shell">
  <div class="error-code">403</div>
  <h1>Truy cập bị từ chối</h1>
  <p style="max-width:420px;">Bạn không có quyền truy cập trang này. Nếu bạn cho rằng đây là sự nhầm lẫn, vui lòng liên hệ quản trị viên.</p>
  <div style="display:flex; gap:10px; margin-top:14px;">
    <a href="index.html" class="btn btn-ghost">Về trang chủ</a>
    <a href="login.html" class="btn btn-primary" id="loginLink">Đăng nhập</a>
  </div>
</div>
<script src="js/api.js"></script>
<script>
if (Auth.isLoggedIn()){
  const link = document.getElementById('loginLink');
  link.textContent = 'Về trang tổng quan';
  link.href = Auth.homeFor(Auth.getRole());
}
</script>
</body>
</html>
